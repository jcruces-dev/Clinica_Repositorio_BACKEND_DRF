# Nombre del workflow. Aparecerá en la pestaña "Actions" de GitHub.
name: 2. CD - Deploy to Dev & Test

# Define CUÁNDO se ejecuta este workflow.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Variables de entorno globales para todo el workflow.
env:
  # Imagen base para PRODUCCIÓN (sin Faker, ultra ligera)
  IMAGE_NAME_PROD: ghcr.io/jcruces-dev/backend-clinica-bp
  # Imagen base para DESARROLLO/TEST (con Faker, Pytest, Mock)
  IMAGE_NAME_DEV: ghcr.io/jcruces-dev/backend-clinica-bp-dev

jobs:
  # ==========================================================
  # JOB 1: Llamada al Workflow Reutilizable de Pruebas
  # ==========================================================
  tests:
    uses: ./.github/workflows/tests.yml

  # ==========================================================
  # JOB 2: Construir y publicar AMBAS imágenes (Dev y Prod)
  # ==========================================================
  build-and-push:
    name: Build and Push (Dev/Test & Prod)
    needs: tests
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout código
        uses: actions/checkout@v7
        
      # --- METADATOS PARA LA IMAGEN DE PRODUCCIÓN ---
      - name: Extraer metadatos (Prod)
        id: meta-prod
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_PROD }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            
      # --- METADATOS PARA LA IMAGEN DE DESARROLLO ---
      - name: Extraer metadatos (Dev)
        id: meta-dev
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_DEV }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      # 1. BUILD Y PUSH: Imagen de Desarrollo (La que usarán Dev y Test)
      - name: Build y push DEV (Development Stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Usa la etapa 'development' de tu Dockerfile (incluye requirements-dev.txt)
          target: development
          tags: ${{ steps.meta-dev.outputs.tags }}

      # 2. BUILD Y PUSH: Imagen de Producción (Ligera, sin herramientas de test)
      - name: Build y push PROD (Production Stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Usa la etapa 'production' de tu Dockerfile (solo requirements.txt)
          target: production
          tags: ${{ steps.meta-prod.outputs.tags }}

  # ==========================================================
  # JOB 3: Actualizar manifiestos de Kubernetes (GitOps)
  # ==========================================================
  update-dev-test:
    name: Update Dev & Test Manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo de infraestructura
        uses: actions/checkout@v7
        with:
          repository: jcruces-dev/clinica-k8s-infrastructure
          token: ${{ secrets.GH_PAT }}
          path: infra
          
      - name: Actualizar manifiestos (Inyectar imagen DEV)
        run: |
          cd infra
          DEPLOY_TAG="sha-${{ github.sha }}"
          
          # Busca en Dev y Test, y reemplaza la imagen por la de -dev.
          # Nota: La regex busca 'backend-clinica-bp[opcional -dev]:algo' y lo cambia por 'backend-clinica-bp-dev:sha-...'
          find Dev Test -type f -name "*.yaml" -exec sed -i "s|image: ghcr.io/jcruces-dev/backend-clinica-bp[^:]*:.*|image: ghcr.io/jcruces-dev/backend-clinica-bp-dev:${DEPLOY_TAG}|g" {} +
          
      - name: Commit y push
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update Dev/Test image to DEV tag sha-${{ github.sha }}"
          git push