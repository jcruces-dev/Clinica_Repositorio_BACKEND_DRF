# Nombre del workflow. Aparecerá en la pestaña "Actions" de GitHub.
name: CI-Backend-Clinica-BP

# Define CUÁNDO se ejecuta el workflow.
on:
  # 1. Se ejecuta cuando haces push a la rama main.
  push:
    branches: [ main ]
    # 2. También se ejecuta cuando creas un tag de versión (ej. v1.0.0) para desplegar.
    tags:
      - 'v*'
  # 3. Se ejecuta cuando abres un Pull Request hacia la rama main.
  pull_request:
    branches: [ main ]
  # 4. Permite ejecutarlo manualmente desde la pestaña Actions en GitHub.
  workflow_dispatch:

# Variables de entorno globales para todo el workflow.
env:
  # Nombre de la imagen en GHCR (GitHub Container Registry).
  IMAGE_NAME: ghcr.io/jcruces-dev/backend-clinica-bp

# Define los trabajos (jobs) que se ejecutarán.
jobs:
  # ==========================================================
  # JOB 1: Pruebas Automatizadas (CI - Quality Gate)
  # ==========================================================
  test:
    # Nombre visible del job en la interfaz de GitHub Actions.
    name: Run Pytest
    # Sistema operativo de la máquina virtual donde correrá el job.
    runs-on: ubuntu-latest
    
    # Levantamos una base de datos temporal (efímera) solo para las pruebas.
    services:
      postgres:
        image: postgres:15 # Usamos la imagen de Postgres 15
        env:
          # Credenciales para la base de datos de prueba
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: clinica_test
        ports:
          - 5432:5432 # Exponemos el puerto
        # Verifica que la base de datos esté lista antes de continuar con los tests.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # PASO 1: Descarga tu código en la máquina virtual de GitHub.
      - name: Checkout código
        uses: actions/checkout@v4

      # PASO 2: Instala la misma versión de Python que usas localmente.
      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # PASO 3: Instala las librerías del sistema necesarias para compilar psycopg2.
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev python3-dev

      # PASO 4: Instala las librerías de Python (incluyendo Pytest desde requirements-dev.txt)
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r Clinica_DRF/requirements-dev.txt

      # PASO 5: Ejecuta las pruebas con Pytest.
      - name: Ejecutar Pruebas
        env:
          # 👇 AQUÍ ESTÁN TODAS LAS VARIABLES DE TU .env (Con valores falsos para CI)
          # Variables de Base de Datos
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: clinica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          
          # Variables de Seguridad y Django
          SECRET_KEY: 'django-insecure-clave-falsa-solo-para-github-actions'
          DEBUG: 'True'
          ALLOWED_HOSTS: '*'
          CORS_ALLOWED_ORIGINS: 'http://localhost'
          
          # Variables de Correo (Falsas, no se enviarán correos reales en los tests)
          EMAIL_BACKEND: 'django.core.mail.backends.smtp.EmailBackend'
          EMAIL_HOST: 'smtp.gmail.com'
          EMAIL_PORT: '587'
          EMAIL_USE_TLS: 'True'
          EMAIL_HOST_USER: 'test@test.com'
          EMAIL_HOST_PASSWORD: 'password-falso'
          
          # Variable de Stripe (Falsa, los pagos están mockeados)
          STRIPE_SECRET_KEY: 'sk_test_clave_falsa_para_github_actions'
        run: |
          # Ejecutamos Pytest apuntando a la configuración
          pytest -v -c Clinica_DRF/pytest.ini

  # ==========================================================
  # JOB 2: Construir y publicar la imagen Docker en GHCR.
  # ==========================================================
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    # 🚨 CRUCIAL: Este job SOLO se ejecutará si el job 'test' pasa con éxito.
    needs: test 
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Usamos la etapa 'production' de tu Dockerfile Multi-Etapa.
          target: production
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ==========================================================
  # JOB 3: Actualizar el manifiesto de Kubernetes (GitOps)
  # ==========================================================
  update-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    # Este job depende de que la imagen se haya construido y subido correctamente.
    needs: build-and-push
    
    steps:
      - name: Checkout repo de infraestructura
        uses: actions/checkout@v4
        with:
          repository: jcruces-dev/clinica-k8s-infrastructure
          token: ${{ secrets.GH_PAT }}
          path: infra

      - name: Actualizar imagen en los manifiestos
        run: |
          cd infra
          # Busca la imagen vieja y la reemplaza por el nuevo tag de versión en Dev.
          sed -i "s|image: ghcr.io/jcruces-dev/backend-clinica-bp:.*|image: ghcr.io/jcruces-dev/backend-clinica-bp:${{ github.ref_name }}|g" Dev/backend/backend-deployment.yaml
          # Busca la imagen vieja y la reemplaza por el nuevo tag de versión en Test.
          sed -i "s|image: ghcr.io/jcruces-dev/backend-clinica-bp:.*|image: ghcr.io/jcruces-dev/backend-clinica-bp:${{ github.ref_name }}|g" Test/backend/backend-deployment.yaml

      - name: Commit y push
        run: |
          cd infra
          # Configurar el usuario que hará el commit (el bot de GitHub Actions).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Añadir los archivos modificados al staging.
          git add Dev/backend/backend-deployment.yaml Test/backend/backend-deployment.yaml
          # Hacer commit solo si hay cambios reales (evita errores si no cambió nada).
          git diff --staged --quiet || git commit -m "Update backend image to ${{ github.ref_name }}"
          # Subir los cambios al repositorio de infraestructura.
          git push
