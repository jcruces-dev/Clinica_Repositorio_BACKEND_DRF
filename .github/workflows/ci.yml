# Nombre del workflow. Aparecerá en la pestaña "Actions" de GitHub.
name: CI-Backend-Clinica-BP

# Define CUÁNDO se ejecuta el workflow.
on:
  # 1. Se ejecuta cuando haces push a la rama main.
  push:
    branches: [ main ]
    # 2. También se ejecuta cuando creas un tag de versión (ej. v1.0.0).
    tags:
      - 'v*'
  # 3. Se ejecuta cuando abres o actualizas un Pull Request hacia main.
  pull_request:
    branches: [ main ]
  # 4. Permite ejecutarlo manualmente desde la pestaña Actions.
  workflow_dispatch:

# Variables de entorno globales para todo el workflow.
env:
  # Nombre base de la imagen en GHCR (GitHub Container Registry).
  IMAGE_NAME: ghcr.io/jcruces-dev/backend-clinica-bp

# Define los trabajos (jobs) que se ejecutarán.
jobs:
  # ==========================================================
  # JOB 1: Pruebas Automatizadas (CI - Quality Gate)
  # ==========================================================
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    
    # Levantamos una base de datos PostgreSQL temporal para las pruebas.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: clinica_test
        ports:
          - 5432:5432
        # Healthcheck para esperar a que la BD esté lista antes de correr los tests.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Descarga el código del repositorio en la máquina virtual.
      - name: Checkout código
        uses: actions/checkout@v4

      # Instala Python 3.13.
      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Instala librerías del sistema necesarias para compilar psycopg2 (Postgres).
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev python3-dev

      # Instala las dependencias de Python (incluyendo Pytest y Mock).
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r Clinica_DRF/requirements-dev.txt

      # Ejecuta la suite de pruebas con Pytest.
      - name: Ejecutar Pruebas
        env:
          # Inyectamos las variables de entorno necesarias para que Django arranque.
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: clinica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          SECRET_KEY: 'django-insecure-clave-falsa-solo-para-github-actions'
          DEBUG: 'True'
          ALLOWED_HOSTS: '*'
          CORS_ALLOWED_ORIGINS: 'http://localhost'
          EMAIL_BACKEND: 'django.core.mail.backends.smtp.EmailBackend'
          EMAIL_HOST: 'smtp.gmail.com'
          EMAIL_PORT: '587'
          EMAIL_USE_TLS: 'True'
          EMAIL_HOST_USER: 'test@test.com'
          EMAIL_HOST_PASSWORD: 'password-falso'
          STRIPE_SECRET_KEY: 'sk_test_clave_falsa_para_github_actions'
        run: |
          pytest -v -c Clinica_DRF/pytest.ini


  # ==========================================================
  # JOB 2: Construir y publicar la imagen Docker en GHCR.
  # ==========================================================
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    # Solo se ejecuta si el Job 1 (Pytest) pasa en verde.
    needs: test 
    
    # Permisos necesarios para leer el repo y escribir en el registro de paquetes.
    permissions:
      contents: read
      packages: write

    steps:
      # Descarga el código.
      - name: Checkout código
        uses: actions/checkout@v4

      # Inicia sesión en GitHub Container Registry.
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construye la imagen de la etapa 'production' y la sube a GHCR.
      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: production
          # Usamos el SHA del commit y el número de ejecución como tags (sin barras).
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:run-${{ github.run_number }}


  # ==========================================================
  # JOB 3: Actualizar el manifiesto de Kubernetes (GitOps)
  # ==========================================================
  update-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    # Solo se ejecuta si la imagen se construyó y subió correctamente.
    needs: build-and-push
    
    steps:
      # Clona el repositorio de infraestructura usando el token GH_PAT.
      - name: Checkout repo de infraestructura
        uses: actions/checkout@v4
        with:
          repository: jcruces-dev/clinica-k8s-infrastructure
          token: ${{ secrets.GH_PAT }}
          path: infra

      # Actualiza la imagen en los manifiestos YAML usando find y sed.
      - name: Actualizar imagen en los manifiestos
        run: |
          cd infra
          # 👇 TRUCO MAESTRO: Busca en las carpetas Dev y Test cualquier archivo .yaml 
          # y reemplaza la imagen por el SHA del commit. ¡No importa el nombre exacto del archivo!
          find Dev Test -type f -name "*.yaml" -exec sed -i "s|image: ghcr.io/jcruces-dev/backend-clinica-bp:.*|image: ghcr.io/jcruces-dev/backend-clinica-bp:${{ github.sha }}|g" {} +

      # Hace commit y push de los archivos modificados.
      - name: Commit y push
        run: |
          cd infra
          # Configura el usuario del bot.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 👇 Añadimos TODOS los cambios. Si find modificó archivos, esto los atrapa a todos.
          git add .
          # Solo hace commit si realmente hubo cambios en los archivos.
          git diff --staged --quiet || git commit -m "Update backend image to ${{ github.sha }}"
          # Empuja los cambios al repositorio.
          git push
