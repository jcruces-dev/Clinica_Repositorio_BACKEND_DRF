# Define CUÁNDO se ejecuta el workflow.
on:
  # Se ejecuta cuando se crea un tag que empieza con "v" (ej: v1.0.0, v1.1.0, v2.0.0)
  push:
    tags:
      - 'v*'
  # También permite ejecutarlo manualmente desde la pestaña Actions.
  workflow_dispatch:

# Variables de entorno globales.
env:
  # Nombre de la imagen en GHCR.
  IMAGE_NAME: ghcr.io/jcruces-dev/backend-clinica-bp

# Define los trabajos (jobs) que se ejecutarán.
jobs:
  # Job 1: Construir y publicar la imagen Docker.
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    # Permisos necesarios para autenticarse en GHCR.
    permissions:
      contents: read
      packages: write

    steps:
      # PASO 1: Descargar el código del repositorio.
      - name: Checkout código
        uses: actions/checkout@v4

      # PASO 2: Autenticarse en GHCR con el GITHUB_TOKEN automático.
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PASO 3: Construir y publicar la imagen Docker con el tag de Git.
      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          # Contexto: la raíz del repo (donde está el Dockerfile).
          context: .
          # Publicar la imagen en GHCR.
          push: true
          # Tags: uno con el tag de Git, otro con el SHA del commit.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}