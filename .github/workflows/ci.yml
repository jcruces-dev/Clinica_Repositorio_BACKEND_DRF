# Nombre del workflow. Aparecerá en la pestaña "Actions" de GitHub.
name: CI-Backend-Clinica-BP

# Define CUÁNDO se ejecuta el workflow.
on:
  # 1. Se ejecuta cuando haces push a la rama main (para correr las pruebas en cada cambio).
  push:
    branches:
      - main
    tags:
      - 'v*' # 2. También se ejecuta cuando creas un tag de versión (ej. v1.0.0).
  # 3. Permite ejecutarlo manualmente desde la pestaña Actions en GitHub.
  workflow_dispatch:

# Variables de entorno globales para todo el workflow.
env:
  # Nombre de la imagen que se construirá en GHCR (GitHub Container Registry).
  IMAGE_NAME: ghcr.io/jcruces-dev/backend-clinica-bp

# Define los trabajos (jobs) que se ejecutarán. Se ejecutan en paralelo a menos que se indique lo contrario.
jobs:
  # ==========================================================
  # JOB 1: Pruebas Unitarias y de Integración (Quality Gate)
  # ==========================================================
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    
    # Levantamos una base de datos temporal (efímera) solo para las pruebas.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: clinica_test
        ports:
          - 5432:5432
        # Verifica que la base de datos esté lista antes de continuar.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Descarga tu código en la máquina virtual de GitHub.
      - name: Checkout código
        uses: actions/checkout@v4

      # Instala la misma versión de Python que usas localmente.
      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Instala las librerías del sistema necesarias para compilar psycopg2.
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev python3-dev

      # Instala las librerías de Python (incluyendo Pytest desde requirements-dev.txt)
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r Clinica_DRF/requirements-dev.txt

      # Ejecuta las pruebas con Pytest.
      - name: Ejecutar Pruebas
        env:
          # Le pasamos las credenciales de la base de datos temporal a Django.
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: clinica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
        run: |
          pytest -v -c Clinica_DRF/pytest.ini


  # ==========================================================
  # JOB 2: Construir y publicar la imagen Docker en GHCR.
  # ==========================================================
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    # 🚨 CRUCIAL: Este job SOLO se ejecutará si el job 'test' pasa con éxito.
    # Si Pytest falla, la imagen Docker nunca se construye.
    needs: test 
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 🚨 IMPORTANTE: Usamos la etapa 'production' de tu Dockerfile Multi-Etapa.
          target: production
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}


  # ==========================================================
  # JOB 3: Actualizar el manifiesto de Kubernetes (GitOps)
  # ==========================================================
  update-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    # Este job depende de que la imagen se haya construido y subido correctamente.
    needs: build-and-push
    
    steps:
      - name: Checkout repo de infraestructura
        uses: actions/checkout@v4
        with:
          repository: jcruces-dev/clinica-k8s-infrastructure
          token: ${{ secrets.GH_PAT }}
          path: infra

      - name: Actualizar imagen en los manifiestos
        run: |
          cd infra
          sed -i "s|image: ghcr.io/jcruces-dev/backend-clinica-bp:.*|image: ghcr.io/jcruces-dev/backend-clinica-bp:${{ github.ref_name }}|g" Dev/backend/backend-deployment.yaml
          sed -i "s|image: ghcr.io/jcruces-dev/backend-clinica-bp:.*|image: ghcr.io/jcruces-dev/backend-clinica-bp:${{ github.ref_name }}|g" Test/backend/backend-deployment.yaml

      - name: Commit y push
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dev/backend/backend-deployment.yaml Test/backend/backend-deployment.yaml
          git diff --staged --quiet || git commit -m "Update backend image to ${{ github.ref_name }}"
          git push