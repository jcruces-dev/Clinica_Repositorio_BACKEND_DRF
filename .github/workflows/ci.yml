# Nombre del workflow. Aparecerá en la pestaña "Actions" de GitHub.
name: CI-Backend-Clinica-BP

# Define CUÁNDO se ejecuta el workflow.
on:
  # 1. Se ejecuta cuando haces push a la rama main.
  push:
    branches: [ main ]
    # 2. También se ejecuta cuando creas un tag de versión (ej. v1.0.0).
    tags:
      - 'v*'
  # 3. Se ejecuta cuando abres o actualizas un Pull Request hacia main.
  pull_request:
    branches: [ main ]
  # 4. Permite ejecutarlo manualmente desde la pestaña Actions.
  workflow_dispatch:

# Variables de entorno globales para todo el workflow.
env:
  # Nombre base de la imagen en GHCR (GitHub Container Registry).
  IMAGE_NAME: ghcr.io/jcruces-dev/backend-clinica-bp

# Define los trabajos (jobs) que se ejecutarán.
jobs:
  # ==========================================================
  # JOB 1: Pruebas Automatizadas (CI - Quality Gate)
  # ==========================================================
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: clinica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev python3-dev

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r Clinica_DRF/requirements-dev.txt

      - name: Ejecutar Pruebas
        env:
          # Variables inyectadas para que Django no falle en CI
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: clinica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          SECRET_KEY: 'django-insecure-clave-falsa-solo-para-github-actions'
          DEBUG: 'True'
          ALLOWED_HOSTS: '*'
          CORS_ALLOWED_ORIGINS: 'http://localhost'
          EMAIL_BACKEND: 'django.core.mail.backends.smtp.EmailBackend'
          EMAIL_HOST: 'smtp.gmail.com'
          EMAIL_PORT: '587'
          EMAIL_USE_TLS: 'True'
          EMAIL_HOST_USER: 'test@test.com'
          EMAIL_HOST_PASSWORD: 'password-falso'
          STRIPE_SECRET_KEY: 'sk_test_clave_falsa_para_github_actions'
        run: |
          pytest -v -c Clinica_DRF/pytest.ini


  # ==========================================================
  # JOB 2: Construir y publicar la imagen Docker en GHCR.
  # ==========================================================
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    # Solo se ejecuta si el Job 1 (Pytest) pasa en verde.
    needs: test 
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: production
          # 👇 LA SOLUCIÓN DEFINITIVA 👇
          # Usamos github.sha (ID del commit) y github.run_number (Número de ejecución).
          # Ninguno de estos dos valores contiene barras "/", por lo que Docker los aceptará siempre.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:run-${{ github.run_number }}


  # ==========================================================
  # JOB 3: Actualizar el manifiesto de Kubernetes (GitOps)
  # ==========================================================
  update-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    # Solo se ejecuta si la imagen se construyó y subió correctamente.
    needs: build-and-push
    
    steps:
      - name: Checkout repo de infraestructura
        uses: actions/checkout@v4
        with:
          repository: jcruces-dev/clinica-k8s-infrastructure
          token: ${{ secrets.GH_PAT }}
          path: infra

      - name: Actualizar imagen en los manifiestos
        run: |
          cd infra
          # 👇 IMPORTANTE: Actualizamos los YAMLs usando el mismo tag (github.sha) que usamos en Docker.
          sed -i "s|image: ghcr.io/jcruces-dev/backend-clinica-bp:.*|image: ghcr.io/jcruces-dev/backend-clinica-bp:${{ github.sha }}|g" Dev/backend/backend-deployment.yaml
          sed -i "s|image: ghcr.io/jcruces-dev/backend-clinica-bp:.*|image: ghcr.io/jcruces-dev/backend-clinica-bp:${{ github.sha }}|g" Test/backend/backend-deployment.yaml

      - name: Commit y push
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dev/backend/backend-deployment.yaml Test/backend/backend-deployment.yaml
          # Hace commit solo si hubo cambios reales.
          git diff --staged --quiet || git commit -m "Update backend image to ${{ github.sha }}"
          git push
