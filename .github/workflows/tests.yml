# Nombre del workflow reutilizable
name: Reusable Pytest Workflow

# 👇 LA MAGIA: Esto permite que otros workflows lo importen y lo usen
on:
  workflow_call:

jobs:
  run-tests:
    # Nombre visible del trabajo en la interfaz.
    name: Run Pytest
    # Sistema operativo de la máquina virtual.
    runs-on: ubuntu-latest
    
    # Levantamos la base de datos PostgreSQL temporal.
    services:
      postgres:
        # Imagen oficial de PostgreSQL.
        image: postgres:15
        env:
          # Credenciales de la base de datos de prueba.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: clinica_test
        # Mapeo de puertos para conectar desde Django.
        ports:
          - 5432:5432
        # Healthcheck: Verifica que Postgres esté listo antes de correr los tests.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Pasos secuenciales del job.
    steps:
      # Paso 1: Descarga el código del repositorio.
      - name: Checkout código
        uses: actions/checkout@v4
        
      # Paso 2: Configura el entorno de Python 3.13.
      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      # Paso 3: Instala dependencias del sistema con tolerancia a fallos de red.
      - name: Instalar dependencias del sistema
        run: |
          # 🛠️ BUCLE DE RESILIENCIA: Intentaremos instalar hasta 5 veces.
          # Esto soluciona los fallos de DNS intermitentes de los servidores de GitHub.
          for i in 1 2 3 4 5; do
            # Imprime en el log el número de intento actual.
            echo "🔄 Intento $i de 5 para instalar dependencias del sistema..."
            
            # Primero, corrige el mirror de Azure por el oficial de Ubuntu (por si acaso).
            # El '|| true' evita que falle si el archivo no existe.
            sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources || true
            sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list || true
            
            # Actualiza los repositorios e instala los paquetes.
            # Usamos && para que si update falla, no intente install.
            # --no-install-recommends reduce el número de paquetes a descargar.
            if sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libpq-dev python3-dev; then
              # Si ambos comandos tienen éxito, imprimimos éxito y salimos del bucle.
              echo "✅ Dependencias instaladas correctamente."
              exit 0
            fi
            
            # Si llegamos aquí, es porque falló el intento. Calculamos cuánto esperar.
            # Fórmula: 10 * (2 ^ (i-1)) -> 10s, 20s, 40s, 80s.
            SLEEP_TIME=$((10 * 2 ** (i - 1)))
            echo "⚠️ Fallo de red en el intento $i. Reintentando en $SLEEP_TIME segundos..."
            # Pausa la ejecución.
            sleep $SLEEP_TIME
          done
          
          # Si el bucle termina sin éxito (los 5 intentos fallaron), el pipeline se detiene.
          echo "❌ Error crítico: No se pudieron instalar las dependencias tras 5 intentos."
          exit 1
          
      # Paso 4: Instala las dependencias de Python (Pytest, Mock, etc.).
      - name: Instalar dependencias Python
        run: |
          # Actualiza pip a la última versión.
          python -m pip install --upgrade pip
          # Instala las librerías del archivo requirements-dev.txt.
          pip install -r Clinica_DRF/requirements-dev.txt
          
      # Paso 5: Ejecuta la suite de pruebas con las variables de entorno inyectadas.
      - name: Ejecutar Pruebas
        env:
          # Variables de Base de Datos (apuntando al contenedor local).
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: clinica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          # Variables de Django (Claves falsas solo para pruebas).
          SECRET_KEY: 'django-insecure-clave-falsa'
          DEBUG: 'True'
          ALLOWED_HOSTS: '*'
          CORS_ALLOWED_ORIGINS: 'http://localhost'
          # Variables de Email (Falsas, no se enviarán correos reales).
          EMAIL_BACKEND: 'django.core.mail.backends.smtp.EmailBackend'
          EMAIL_HOST: 'smtp.gmail.com'
          EMAIL_PORT: '587'
          EMAIL_USE_TLS: 'True'
          EMAIL_HOST_USER: 'test@test.com'
          EMAIL_HOST_PASSWORD: 'password-falso'
          # Variable de Stripe (Falsa, los pagos están mockeados).
          STRIPE_SECRET_KEY: 'sk_test_clave_falsa'
        run: |
          # Corre Pytest apuntando al archivo de configuración central.
          pytest -v -c Clinica_DRF/pytest.ini