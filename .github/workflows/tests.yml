# Nombre del workflow reutilizable
name: Reusable Pytest Workflow

# 👇 LA MAGIA: Esto permite que otros workflows lo importen y lo usen
on:
  workflow_call:

jobs:
  run-tests:
    name: Run Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: clinica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev python3-dev
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r Clinica_DRF/requirements-dev.txt
      - name: Ejecutar Pruebas
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: clinica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          SECRET_KEY: 'django-insecure-clave-falsa'
          DEBUG: 'True'
          ALLOWED_HOSTS: '*'
          CORS_ALLOWED_ORIGINS: 'http://localhost'
          EMAIL_BACKEND: 'django.core.mail.backends.smtp.EmailBackend'
          EMAIL_HOST: 'smtp.gmail.com'
          EMAIL_PORT: '587'
          EMAIL_USE_TLS: 'True'
          EMAIL_HOST_USER: 'test@test.com'
          EMAIL_HOST_PASSWORD: 'password-falso'
          STRIPE_SECRET_KEY: 'sk_test_clave_falsa'
        run: |
          pytest -v -c Clinica_DRF/pytest.ini