# ==========================================================
# WORKFLOW: Release to Production
# ==========================================================
# Este pipeline:
# 1. Ejecuta los tests obligatorios.
# 2. Construye la imagen de producción.
# 3. La publica en GHCR.
# 4. Actualiza automáticamente los manifiestos Kubernetes
#    del entorno Prod (GitOps).
# 5. Requiere aprobación manual antes de modificar Producción.
# ==========================================================

name: 3. Release to Production

# ----------------------------------------------------------
# CUÁNDO SE EJECUTA
# ----------------------------------------------------------
on:

  # Se ejecuta cuando se crea un tag que comienza con "v"
  # Ejemplos:
  # v1.0.0
  # v1.0.1
  # v2.0.0
  push:
    tags:
      - 'v*'

  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:

# ----------------------------------------------------------
# VARIABLES GLOBALES
# ----------------------------------------------------------
env:

  # Imagen de producción publicada en GHCR
  IMAGE_NAME: ghcr.io/jcruces-dev/backend-clinica-bp

# ----------------------------------------------------------
# JOBS
# ----------------------------------------------------------
jobs:

  # ========================================================
  # JOB 1 - TESTS OBLIGATORIOS
  # ========================================================
  tests:

    # Ejecuta el workflow reutilizable de pruebas
    # Si algún test falla, todo el pipeline se detiene
    uses: ./.github/workflows/tests.yml

  # ========================================================
  # JOB 2 - BUILD DE LA IMAGEN DE PRODUCCIÓN
  # ========================================================
  build-release:

    name: Build Production Image

    # Espera que los tests finalicen correctamente
    needs: tests

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------
      # Descarga el código fuente
      # ----------------------------------------------------
      - name: Checkout código
        uses: actions/checkout@v7

      # ----------------------------------------------------
      # Login en GitHub Container Registry
      # ----------------------------------------------------
      - name: Login a GHCR
        uses: docker/login-action@v4

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------
      # Build y publicación de imagen de producción
      # ----------------------------------------------------
      - name: Build y push (Versión Semántica)

        uses: docker/build-push-action@v7

        with:
          context: .

          push: true

          # Utiliza la etapa production del Dockerfile
          target: production

          # Ejemplo:
          # ghcr.io/jcruces-dev/backend-clinica-bp:v1.0.2
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  # ========================================================
  # JOB 3 - DESPLIEGUE GITOPS A PRODUCCIÓN
  # ========================================================
  deploy-prod:

    name: Deploy to Production

    # Espera a que la imagen se construya correctamente
    needs: build-release

    runs-on: ubuntu-latest

    # GitHub pedirá aprobación manual si configuraste
    # revisores en el Environment "production"
    environment: production

    steps:

      # ----------------------------------------------------
      # Clona el repositorio GitOps
      # ----------------------------------------------------
      - name: Checkout repo de infraestructura

        uses: actions/checkout@v7

        with:
          repository: jcruces-dev/clinica-k8s-infrastructure
          token: ${{ secrets.GH_PAT }}
          path: infra

      # ----------------------------------------------------
      # Actualiza imagen de Producción en los manifiestos
      # ----------------------------------------------------
      - name: Actualizar manifiestos de Producción

        run: |

          # Entrar al repositorio GitOps
          cd infra

          # Obtiene el tag que disparó el Release
          # Ejemplo:
          # v1.0.2
          DEPLOY_TAG="${{ github.ref_name }}"

          echo "Actualizando manifiestos de Producción..."

          # =================================================
          # Busca TODOS los YAML de Producción
          #
          # Soporta:
          # *.yaml
          # *.yml
          #
          # Esto evita problemas futuros si mezclas ambas
          # extensiones dentro del repositorio GitOps.
          # =================================================
          find Prod -type f \( -name "*.yaml" -o -name "*.yml" \) \
          -exec sed -i \
          "s|image: ghcr.io/jcruces-dev/backend-clinica-bp[^:]*:.*|image: ghcr.io/jcruces-dev/backend-clinica-bp:${DEPLOY_TAG}|g" \
          {} +

      # ----------------------------------------------------
      # Commit y Push al repositorio GitOps
      # ----------------------------------------------------
      - name: Commit y push

        run: |

          cd infra

          # Usuario que aparecerá en el historial Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Agrega únicamente los manifiestos de Producción
          git add Prod/

          # Crea commit sólo si realmente hubo cambios
          git diff --staged --quiet || \
          git commit -m "Update PROD image to ${{ github.ref_name }}"

          # Empuja los cambios al repositorio GitOps
          git push