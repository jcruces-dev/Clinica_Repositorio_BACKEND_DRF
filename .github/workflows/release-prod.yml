name: 3. Release to Production
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/jcruces-dev/backend-clinica-bp

jobs:
  # ==========================================================
  # JOB 1: Pruebas de regresión (Independiente para Producción)
  # ==========================================================
  test:
    name: Run Pytest (Regression)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: clinica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev python3-dev
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r Clinica_DRF/requirements-dev.txt
      - name: Ejecutar Pruebas
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_DB: clinica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          SECRET_KEY: 'django-insecure-clave-falsa'
          DEBUG: 'True'
          ALLOWED_HOSTS: '*'
          CORS_ALLOWED_ORIGINS: 'http://localhost'
          EMAIL_BACKEND: 'django.core.mail.backends.smtp.EmailBackend'
          EMAIL_HOST: 'smtp.gmail.com'
          EMAIL_PORT: '587'
          EMAIL_USE_TLS: 'True'
          EMAIL_HOST_USER: 'test@test.com'
          EMAIL_HOST_PASSWORD: 'password-falso'
          STRIPE_SECRET_KEY: 'sk_test_clave_falsa'
        run: |
          pytest -v -c Clinica_DRF/pytest.ini

  # ==========================================================
  # JOB 2: Construir imagen con tag semántico (v1.0.0)
  # ==========================================================
  build-release:
    name: Build Production Image
    needs: test # 👈 Ahora funciona porque 'test' está en este mismo archivo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y push (Versión Semántica)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: production
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  # ==========================================================
  # JOB 3: Desplegar a Producción (GitOps)
  # ==========================================================
  deploy-prod:
    name: Deploy to Production
    needs: build-release # 👈 Ahora funciona porque 'build-release' está en este archivo
    runs-on: ubuntu-latest
    environment: production 
    steps:
      - name: Checkout repo de infraestructura
        uses: actions/checkout@v4
        with:
          repository: jcruces-dev/clinica-k8s-infrastructure
          token: ${{ secrets.GH_PAT }}
          path: infra
      - name: Actualizar manifiestos de Producción
        run: |
          cd infra
          DEPLOY_TAG="${{ github.ref_name }}"
          # Busca en la carpeta Prod
          find Prod -type f -name "*.yaml" -exec sed -i "s|image: ghcr.io/jcruces-dev/backend-clinica-bp:.*|image: ghcr.io/jcruces-dev/backend-clinica-bp:${DEPLOY_TAG}|g" {} +
      - name: Commit y push
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Prod/
          git diff --staged --quiet || git commit -m "Update PROD image to ${{ github.ref_name }}"
          git push